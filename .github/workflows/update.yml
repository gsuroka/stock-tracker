name: Update quotes

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Fetch quotes
        env:
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
        run: |
          node scripts/fetch_quotes.js

      - name: Commit updated data.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data.json
          git commit -m "Update data.json" || exit 0
          git push

      - name: Update portfolio status issue
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');

            const data = JSON.parse(fs.readFileSync('docs/data.json','utf8'));
            const cur = data.baseCurrency || "EUR";

            const money = new Intl.NumberFormat("de-DE",{style:"currency",currency:cur});
            const pct = v => `${v>=0?"+":""}${Number(v||0).toFixed(2)}%`;
            const sign = v => (Number(v||0) >= 0 ? "+" : "");

            const total = Number(data?.totals?.value || 0);
            const day = Number(data?.totals?.dayChange || 0);
            const dayPct = Number(data?.totals?.dayChangePct || 0);

            const rows = (data.positions || []).map(p =>
              `• ${p.symbol}: ${money.format(p.value || 0)} (${sign(p.dayChangeValue)}${money.format(p.dayChangeValue || 0)} / ${pct(p.changePct)})`
            ).join("\n");

            const body = `📊 PORTFOLIO UPDATE

Gesamt: ${money.format(total)}
Heute: ${sign(day)}${money.format(day)} (${pct(dayPct)})

${rows}

Stand: ${new Date(data.startedAt).toLocaleString("de-DE")}
`;


            const data = JSON.parse(fs.readFileSync('docs/data.json','utf8'));
            const cur = data.baseCurrency || "EUR";

            const money = new Intl.NumberFormat("de-DE",{style:"currency",currency:cur});
            const pct = v => `${v>=0?"+":""}${Number(v||0).toFixed(2)}%`;
            const sign = v => (Number(v||0) >= 0 ? "+" : "");

            const total = Number(data?.totals?.value || 0);
            const day = Number(data?.totals?.dayChange || 0);
            const dayPct = Number(data?.totals?.dayChangePct || 0);

            const rows = (data.positions || []).map(p =>
              `• ${p.symbol}: ${money.format(p.value || 0)} (${sign(p.dayChangeValue)}${money.format(p.dayChangeValue || 0)} / ${pct(p.changePct)})`
            ).join("\n");

            const body = `📊 PORTFOLIO UPDATE

Gesamt: ${money.format(total)}
Heute: ${sign(day)}${money.format(day)} (${pct(dayPct)})

${rows}

Stand: ${new Date(data.startedAt).toLocaleString("de-DE")}
`;

            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              per_page: 100
            });

            const existing = issues.find(i => i.title === "📊 Portfolio Auto");

            if (existing) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: "📊 Portfolio Auto",
                body
              });
            }
